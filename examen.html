<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 30px;
        }

        main {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <main>
        <h1>Inscripción</h1>

        <form id="formulario">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" required>

            <label for="modalidad">Modalidad:</label>
            <select id="modalidad" required>
                <option value="">Seleccione una modalidad</option>
                <option value="presencial">Presencial</option>
                <option value="virtual">Virtual</option>
            </select>

            <button type="submit">Inscribirse</button>
        </form>

        <p id="resultado" aria-live="polite"></p>
    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const nombre = document.getElementById("nombre");
        const modalidad = document.getElementById("modalidad");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nombreIngresado = nombre.value.trim();
            const modalidadElegida = modalidad.value;

            if (nombreIngresado === "") {
                resultado.textContent = "Por favor, ingrese su nombre.";
                return;
            }

            if (modalidadElegida === "") {
                resultado.textContent = "Seleccione una modalidad.";
                return;
            }

            if (modalidadElegida === "presencial") {
                resultado.textContent =
                    "¡Hola " + nombreIngresado +
                    "! Su inscripción es presencial. Le esperamos en el aula.";
            } else {
                resultado.textContent =
                    "¡Hola " + nombreIngresado +
                    "! Su inscripción es virtual. Recibirá el enlace para ingresar.";
            }
        });
    </script>

</body>
</html>
